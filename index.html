<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athish's Dream Garage</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap');

*{box-sizing:border-box}
body{margin:0;background:#090d13;color:#eaf1fa;font-family:'Rajdhani',sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer}
#scene{position:fixed;inset:0}
canvas{display:block}
.hud{position:fixed;inset:0;pointer-events:none}
.topbar{position:absolute;top:0;left:0;right:0;padding:22px 28px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#080d15dd,transparent)}
.brand{font-family:Orbitron,sans-serif;font-size:clamp(14px,2vw,23px);letter-spacing:3px;font-weight:700}
.brand span{color:#d6a75e}
.subtitle{font-size:12px;letter-spacing:3px;color:#9ba9b9;margin-top:5px}
.status{font-family:Orbitron,sans-serif;font-size:10px;letter-spacing:2px;color:#8dcaab}
.status:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#65d99b;margin-right:9px;box-shadow:0 0 12px #65d99b}
.instruction{position:absolute;top:105px;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:2px;color:#aab7c6;text-align:center;white-space:nowrap}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:16px 22px 20px;background:linear-gradient(transparent,#080d15ee 35%);display:flex;justify-content:space-between;align-items:end;gap:15px;pointer-events:auto}
.bays{display:flex;gap:7px;flex-wrap:wrap}
.bay-btn,.action{border:1px solid #526171;background:#101923dd;color:#dce5ee;padding:9px 13px;border-radius:3px;font-family:Orbitron,sans-serif;font-size:10px;letter-spacing:1px;transition:.2s}
.bay-btn:hover,.bay-btn.active,.action:hover{border-color:#d6a75e;color:#f4c77e;background:#252117}
.bay-btn.active{box-shadow:0 0 15px #d6a75e33}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.panel{position:absolute;left:22px;top:110px;width:min(330px,calc(100vw - 44px));background:#0c131ded;border:1px solid #66583e;padding:18px;pointer-events:auto;display:none;backdrop-filter:blur(12px);box-shadow:0 15px 50px #0009}
.panel.show{display:block}
.panel h2{font-family:Orbitron,sans-serif;font-size:18px;color:#e7bd78;margin:0 0 6px}
.panel .model{font-size:12px;letter-spacing:2px;color:#8f9eae;margin-bottom:16px}
.panel p{font-size:14px;color:#c4cfda;line-height:1.5;margin:8px 0}
.panel .tag{font-size:10px;color:#d6a75e;letter-spacing:2px;margin-top:14px}
.panel .close{float:right;background:none;border:0;color:#aab7c6;font-size:20px}
.panel-actions{display:flex;gap:8px;margin-top:16px}
.panel-actions button{flex:1}
.mobile-note{font-size:10px;color:#718093;margin-top:12px}
@media(max-width:650px){
 .topbar{padding:15px}.status{display:none}
 .instruction{top:85px;font-size:10px}
 .bottom{padding:12px;display:block}
 .bays{justify-content:center}
 .actions{margin-top:10px;justify-content:center}
 .bay-btn{padding:8px 10px;font-size:9px}
 .panel{top:105px;right:12px}
}
</style>
</head>

<body>
<div id="scene"></div>

<div class="hud">
  <div class="topbar">
    <div>
      <div class="brand">ATHISH'S <span>DREAM GARAGE</span></div>
      <div class="subtitle">A PRIVATE COLLECTION · EST. 2026</div>
    </div>
    <div class="status">SYSTEM ONLINE</div>
  </div>

  <div class="instruction">SELECT A BAY TO RAISE YOUR CAR</div>

  <div class="panel" id="panel">
    <button class="close" id="closePanel">×</button>
    <div class="tag">GARAGE COLLECTION / <span id="carNumber">01</span></div>
    <h2 id="carName">SKODA OCTAVIA</h2>
    <div class="model" id="carModel">THE ONE THAT STARTED IT ALL</div>
    <p id="carDescription"></p>
    <p><strong>Body:</strong> <span id="carBody"></span></p>
    <p><strong>Interior:</strong> <span id="carInterior"></span></p>
    <p><strong>Collection status:</strong> <span id="carStatus"></span></p>
    <div class="panel-actions">
      <button class="action" id="parkBtn">PARK CAR</button>
      <button class="action" id="soundBtn">ENGINE SOUND</button>
    </div>
    <div class="mobile-note">Engine sound is a generated preview, not an original recording.</div>
  </div>

  <div class="bottom">
    <div class="bays" id="bayButtons"></div>
    <div class="actions">
      <button class="action" id="closeAll">CLOSE ALL</button>
      <button class="action" id="resetCamera">RESET VIEW</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const cars = [
 {name:"SKODA OCTAVIA",subtitle:"THE ONE THAT STARTED IT ALL",body:"Matte racing red",interior:"Premium tan",status:"NEVER SELL",color:0x9c2028,shape:0,desc:"The heart of this collection. The car that represents you. This bay is permanently reserved."},
 {name:"SKODA SUPERB",subtitle:"THE LUXURY DREAM",body:"Deep metallic black",interior:"Tan luxury leather",status:"DREAM COLLECTION",color:0x202b38,shape:0,desc:"A refined luxury sedan. Comfort, presence and elegance in one machine."},
 {name:"VOLKSWAGEN VIRTUS",subtitle:"THE CHILDHOOD DREAM",body:"Glossy deep red",interior:"Black and tan",status:"DREAM COLLECTION",color:0x871c25,shape:0,desc:"The childhood dream that earned its place in this garage."},
 {name:"BMW M3",subtitle:"THE DRIVER'S MACHINE",body:"Matte graphite",interior:"Black sport interior",status:"DREAM COLLECTION",color:0x303b47,shape:1,desc:"A performance sedan built around the joy of driving."},
 {name:"BMW M5",subtitle:"THE POWERHOUSE",body:"Metallic dark blue",interior:"Black leather",status:"DREAM COLLECTION",color:0x172e50,shape:0,desc:"The special engine sound. The serious performance machine."},
 {name:"MERCEDES-MAYBACH",subtitle:"THE ULTIMATE LUXURY",body:"Obsidian black",interior:"Exclusive tan leather",status:"DREAM COLLECTION",color:0x111318,shape:0,desc:"The ultimate expression of luxury. A special place in the collection."},
 {name:"NISSAN GT-R",subtitle:"THE PAUL WALKER TRIBUTE",body:"Silver metallic",interior:"Black sport interior",status:"DREAM COLLECTION",color:0x9ca5ad,shape:1,desc:"A tribute to an icon. The machine reserved for the track."},
 {name:"MERCEDES-AMG S 63 E",subtitle:"THE PERFORMANCE LUXURY",body:"Glossy obsidian",interior:"Black and tan",status:"DREAM COLLECTION",color:0x141a21,shape:0,desc:"A powerful luxury sedan. Quiet sophistication with serious performance."}
];

let scene,camera,renderer,controls,clock;
let bays=[],activeBay=-1,raycaster,mouse;
let audioContext=null,oscillator=null;
const bayButtons=document.getElementById('bayButtons');
const panel=document.getElementById('panel');

init();
animate();

function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x080d14);
 scene.fog=new THREE.Fog(0x080d14,25,65);

 camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,0.1,120);
 camera.position.set(24,17,29);

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.25;
 document.getElementById('scene').appendChild(renderer.domElement);

 controls=new OrbitControls(camera,renderer.domElement);
 controls.target.set(0,1.3,-0.5);
 controls.enableDamping=true;
 controls.maxPolarAngle=Math.PI/2.05;
 controls.minDistance=10;
 controls.maxDistance=50;

 clock=new THREE.Clock();
 raycaster=new THREE.Raycaster();
 mouse=new THREE.Vector2();

 scene.add(new THREE.HemisphereLight(0xb8c7d8,0x15191f,.9));

 const mainLight=new THREE.DirectionalLight(0xffe8ca,1.25);
 mainLight.position.set(-8,16,8);
 mainLight.castShadow=true;
 mainLight.shadow.mapSize.set(2048,2048);
 scene.add(mainLight);

 buildGarage();
 cars.forEach((car,i)=>createBay(car,i));
 createUI();

 renderer.domElement.addEventListener('pointerdown',onPointerDown);
 window.addEventListener('resize',onResize);
}

function material(color,roughness=.7,metalness=.15){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}

function addBox(parent,w,h,d,x,y,z,mat,cast=true,receive=true){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 mesh.position.set(x,y,z);
 mesh.castShadow=cast;
 mesh.receiveShadow=receive;
 parent.add(mesh);
 return mesh;
}

function buildGarage(){
 const concrete=material(0x30363d,.88);
 const wall=material(0x202831,.9);
 const dark=material(0x10151c,.8);
 const trim=material(0xb49a70,.42,.65);
 const floor=addBox(scene,29,.45,15,0,-.25,0,concrete,false,true);
 floor.receiveShadow=true;

 // Basement walls
 addBox(scene,29,5,.5,0,2.25,-7.25,wall);
 addBox(scene,.5,5,15,-14.25,2.25,0,wall);
 addBox(scene,.5,5,15,14.25,2.25,0,wall);
 addBox(scene,29,.5,.5,0,4.8,7.25,wall);

 // Ceiling
 addBox(scene,29,.35,15,0,5,0,dark,false);
 // Structural beams
 for(let x=-12;x<=12;x+=6){
   addBox(scene,.28,.55,15,x,4.55,0,trim);
 }
 // Floor markings
 const lineMat=new THREE.MeshStandardMaterial({color:0xd6a75e,emissive:0x493019});
 for(let x=-12;x<=12;x+=3.5){
   addBox(scene,.035,.012,8.8,x,.0,-.2,lineMat,false);
 }
 // Back wall panels
 for(let x=-12;x<=12;x+=2){
   addBox(scene,.035,3.4,.04,x,2.4,-6.97,trim,false);
 }
 // Ceiling lights
 for(let x=-10.5;x<=10.5;x+=3){
   const light=new THREE.PointLight(0xffe3c2,24,9,2);
   light.position.set(x,4.35,0);
   scene.add(light);
   const lamp=addBox(scene,1.7,.07,.55,x,4.65,0,material(0xffe4b8,.3),false);
   lamp.material.emissive=new THREE.Color(0x8a6536);
   lamp.material.emissiveIntensity=.18;
 }
 // Entrance ramp
 const ramp=addBox(scene,7,.18,5,0,-.06,8.8,material(0x343b43),false);
 ramp.rotation.x=-.12;
 // Entrance frame
 addBox(scene,29,.3,.3,0,4.4,7.05,trim);
 addBox(scene,.3,4,.3,-14,2.2,7.05,trim);
 addBox(scene,.3,4,.3,14,2.2,7.05,trim);
}

function createBay(car,index){
 const group=new THREE.Group();
 scene.add(group);

 const x=(index-3.5)*3.45;
 group.position.x=x;

 const platformMat=material(0x5b626b,.65,.35);
 const platform=addBox(group,2.8,.24,6.2,0,.2,-.2,platformMat);
 platform.userData.bayIndex=index;

 // Platform edge details
 const edgeMat=material(0xc09252,.45,.65);
 for(const side of [-1,1]){
   addBox(group,.07,.1,6.15,side*1.36,.34,-.2,edgeMat);
 }
 // Hydraulic columns
 const liftMat=material(0x9babb7,.3,.75);
 const lifts=[];
 for(const xx of [-.95,.95]){
  for(const zz of [-2.1,1.7]){
   const lift=addBox(group,.18,1.1,.18,xx,.78,zz,liftMat);
   lifts.push(lift);
  }
 }
 // Bay back wall and divider columns
 addBox(group,3.2,4,.18,0,2.05,-3.5,wallMaterial(),false);
 for(const side of [-1,1]){
  addBox(group,.14,4,7,side*1.65,2,0,material(0x303943),false);
 }
 // Shutter at front
 const shutter=new THREE.Group();
 shutter.position.set(0,2.1,3.35);
 group.add(shutter);
 const shutterMat=material(0x65717d,.65,.55);
 for(let k=0;k<12;k++){
   const slat=addBox(shutter,3.15,.17,.12,0,-1.02+k*.18,0,shutterMat,false);
   slat.userData.bayIndex=index;
 }
 const shutterFrame=addBox(group,3.35,.16,.2,0,4.1,3.35,edgeMat,false);

 const carGroup=createCar(car,index);
 group.add(carGroup);
 carGroup.position.set(0,.4,-.2);

 // Bay number on back wall
 const sign=makeLabel(String(index+1).padStart(2,'0'));
 sign.position.set(0,3.65,-3.38);
 group.add(sign);

 // Invisible clickable pad
 const hit=new THREE.Mesh(new THREE.BoxGeometry(3.15,.2,7),new THREE.MeshBasicMaterial({transparent:true,opacity:0}));
 hit.position.set(0,.65,0);
 hit.userData.bayIndex=index;
 group.add(hit);

 bays.push({group,platform,shutter,carGroup,lifts,hit,raised:false,opening:0});
}

function wallMaterial(){return material(0x333b45,.9)}

function makeLabel(value){
 const canvas=document.createElement('canvas');
 canvas.width=256;canvas.height=128;
 const ctx=canvas.getContext('2d');
 ctx.fillStyle='#111923';ctx.fillRect(0,0,256,128);
 ctx.strokeStyle='#d6a75e';ctx.lineWidth=5;ctx.strokeRect(5,5,246,118);
 ctx.fillStyle='#f0c987';ctx.font='bold 66px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(value,128,65);
 const texture=new THREE.CanvasTexture(canvas);
 const mesh=new THREE.Mesh(new THREE.PlaneGeometry(1.2,.6),new THREE.MeshBasicMaterial({map:texture,transparent:true}));
 return mesh;
}

function createCar(car,index){
 const g=new THREE.Group();
 const paint=new THREE.MeshStandardMaterial({color:car.color,metalness:.72,roughness:.28});
 const glass=new THREE.MeshStandardMaterial({color:0x182b39,metalness:.45,roughness:.18});
 const black=material(0x090d12,.35,.2);
 const chrome=material(0xaab5bd,.25,.85);
 const tire=material(0x111316,.95);
 const tan=material(0x92734e,.7);

 // Car body
 addBox(g,1.75,.48,3.8,0,.72,0,paint);
 addBox(g,1.62,.35,1.1,0,1.03,1.15,paint);
 // Cabin
 const cabin=addBox(g,1.42,.68,1.9,0,1.28,-.25,glass);
 // Roof
 addBox(g,1.38,.09,1.45,0,1.65,-.28,paint);
 // Hood and rear deck
 addBox(g,1.65,.15,1.05,0,.99,1.25,paint);
 addBox(g,1.65,.16,.75,0,.99,-1.5,paint);

 // Front and rear bumpers
 addBox(g,1.7,.22,.22,0,.57,1.98,black);
 addBox(g,1.7,.22,.22,0,.57,-1.98,black);

 // Windshield / rear window
 const wind=material(0x0c1a25,.18,.4);
 const frontWindow=addBox(g,1.38,.48,.06,0,1.31,.73,wind,false);
 frontWindow.rotation.x=-.25;
 const rearWindow=addBox(g,1.36,.45,.06,0,1.3,-1.23,wind,false);
 rearWindow.rotation.x=.25;

 // Seats visible through glass
 for(const z of [-.75,.35]){
  for(const x of [-.42,.42]){
   addBox(g,.42,.48,.38,x,1.05,z,tan,false);
  }
 }
 // Wheels, alloy hubs
 for(const x of [-.91,.91]){
  for(const z of [-1.25,1.25]){
   const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.39,.39,.22,24),tire);
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(x,.48,z);
   wheel.castShadow=true;
   g.add(wheel);
   const hub=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.235,16),chrome);
   hub.rotation.z=Math.PI/2;
   hub.position.set(x*1.01,.48,z);
   g.add(hub);
   const center=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.24,12),black);
   center.rotation.z=Math.PI/2;
   center.position.set(x*1.02,.48,z);
   g.add(center);
  }
 }
 // Headlights
 const lampMat=new THREE.MeshStandardMaterial({color:0xfff1d0,emissive:0xffdca0,emissiveIntensity:1.2});
 for(const x of [-.58,.58]){
  addBox(g,.38,.16,.06,x,.78,2.02,lampMat,false);
  const rear=addBox(g,.38,.14,.06,x,.78,-2.02,material(0xa51f25,.3),false);
  rear.material.emissive=new THREE.Color(0x6b0909);
  rear.material.emissiveIntensity=.8;
 }
 // Side mirrors
 for(const x of [-.95,.95]){
  addBox(g,.18,.13,.25,x,1.15,.55,paint);
 }
 // Front grille
 addBox(g,.75,.25,.035,0,.67,2.04,black,false);
 // Dashboard hint
 addBox(g,1.1,.12,.25,0,1.05,.55,black,false);

 g.userData.bayIndex=index;
 return g;
}

function createUI(){
 cars.forEach((car,i)=>{
  const btn=document.createElement('button');
  btn.className='bay-btn';
  btn.textContent=String(i+1).padStart(2,'0')+' · '+car.name.split(' ')[0];
  btn.addEventListener('click',()=>selectBay(i));
  bayButtons.appendChild(btn);
 });
 document.getElementById('closePanel').onclick=()=>panel.classList.remove('show');
 document.getElementById('parkBtn').onclick=()=>parkBay(activeBay);
 document.getElementById('soundBtn').onclick=toggleSound;
 document.getElementById('closeAll').onclick=closeAll;
 document.getElementById('resetCamera').onclick=resetCamera;
}

function selectBay(index){
 if(activeBay!==-1 && activeBay!==index) parkBay(activeBay);
 activeBay=index;
 const car=cars[index];
 const bay=bays[index];

 bay.raised=true;
 panel.classList.add('show');
 document.getElementById('carNumber').textContent=String(index+1).padStart(2,'0');
 document.getElementById('carName').textContent=car.name;
 document.getElementById('carModel').textContent=car.subtitle;
 document.getElementById('carDescription').textContent=car.desc;
 document.getElementById('carBody').textContent=car.body;
 document.getElementById('carInterior').textContent=car.interior;
 document.getElementById('carStatus').textContent=car.status;

 [...bayButtons.children].forEach((b,i)=>b.classList.toggle('active',i===index));

 // Move camera towards selected bay
 const targetX=bay.group.position.x;
 controls.target.set(targetX,1.5,-0.2);
 camera.position.set(targetX+6,10.5,18);
 controls.update();
}

function parkBay(index){
 if(index<0)return;
 const bay=bays[index];
 bay.raised=false;
 if(activeBay===index){
  activeBay=-1;
  panel.classList.remove('show');
  [...bayButtons.children].forEach(b=>b.classList.remove('active'));
 }
 stopSound();
}

function closeAll(){
 bays.forEach((bay,i)=>bay.raised=false);
 activeBay=-1;
 panel.classList.remove('show');
 [...bayButtons.children].forEach(b=>b.classList.remove('active'));
 stopSound();
}

function resetCamera(){
 camera.position.set(24,17,29);
 controls.target.set(0,1.3,-0.5);
 controls.update();
}

function toggleSound(){
 if(oscillator){stopSound();return;}
 try{
  audioContext=new (window.AudioContext||window.webkitAudioContext)();
  oscillator=audioContext.createOscillator();
  const gain=audioContext.createGain();
  const filter=audioContext.createBiquadFilter();
  oscillator.type='sawtooth';
  oscillator.frequency.setValueAtTime(65,audioContext.currentTime);
  filter.type='lowpass';
  filter.frequency.value=180;
  gain.gain.value=.035;
  oscillator.connect(filter);
  filter.connect(gain);
  gain.connect(audioContext.destination);
  oscillator.start();
  document.getElementById('soundBtn').textContent='STOP SOUND';
 }catch(e){alert('Audio preview is not available in this browser.');}
}

function stopSound(){
 if(oscillator){
  try{oscillator.stop();}catch(e){}
  oscillator=null;
 }
 if(audioContext){audioContext.close();audioContext=null;}
 const btn=document.getElementById('soundBtn');
 if(btn)btn.textContent='ENGINE SOUND';
}

function onPointerDown(event){
 if(event.target.closest('button')||event.target.closest('.panel'))return;
 mouse.x=(event.clientX/innerWidth)*2-1;
 mouse.y=-(event.clientY/innerHeight)*2+1;
 raycaster.setFromCamera(mouse,camera);
 const hits=raycaster.intersectObjects(scene.children,true);
 for(const hit of hits){
  let obj=hit.object;
  while(obj){
   if(obj.userData && Number.isInteger(obj.userData.bayIndex)){
    selectBay(obj.userData.bayIndex);
    return;
   }
   obj=obj.parent;
  }
 }
}

function onResize(){
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 bays.forEach(bay=>{
  const target=bay.raised?2.0:0;
  const current=bay.platform.position.y-.2;
  const next=THREE.MathUtils.damp(current,target,2.1,dt);
  const movement=next-current;
  bay.platform.position.y=.2+next;
  bay.carGroup.position.y=.4+next;
  bay.lifts.forEach(lift=>{
   lift.scale.y=Math.max(.1,1+next*.65);
   lift.position.y=.78+next*.35;
  });
  const targetOpen=bay.raised?1:0;
  bay.opening=THREE.MathUtils.damp(bay.opening,targetOpen,3,dt);
  bay.shutter.position.y=2.1+bay.opening*4.1;
 });
 controls.update();
 renderer.render(scene,camera);
}
</script>
</body>
</html>
