
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athish's Dream Garage</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #080808;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
  background:
    radial-gradient(ellipse at center, #40100f 0%, #160909 35%, #080808 75%);
}

.label {
  color: #d52d2d;
  letter-spacing: 7px;
  font-size: 11px;
  margin-bottom: 25px;
}

h1 {
  font-size: clamp(38px, 8vw, 85px);
  letter-spacing: 4px;
  line-height: 1.1;
}

h1 span {
  color: #d52d2d;
}

.subtitle {
  color: #aaa;
  letter-spacing: 4px;
  font-size: 11px;
  margin-top: 22px;
}

.enter-btn {
  margin-top: 55px;
  padding: 17px 48px;
  background: transparent;
  border: 1px solid #c42b2b;
  color: white;
  letter-spacing: 4px;
  cursor: pointer;
  transition: .4s;
}

.enter-btn:hover {
  background: #b51e1e;
  box-shadow: 0 0 35px #b51e1e88;
}

.garage {
  display: none;
  min-height: 100vh;
  padding: 55px 6%;
  background:
    linear-gradient(180deg, #101010, #080808);
}

.garage-header {
  text-align: center;
  margin-bottom: 55px;
}

.garage-header h2 {
  font-size: clamp(28px, 5vw, 48px);
  letter-spacing: 5px;
}

.garage-header p {
  color: #d52d2d;
  letter-spacing: 4px;
  font-size: 10px;
  margin-top: 14px;
}

.slots {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
  max-width: 1100px;
  margin: auto;
}

.slot {
  background: linear-gradient(145deg, #252525, #101010);
  border: 1px solid #383838;
  min-height: 205px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: .3s;
}

.slot:hover {
  border-color: #c52b2b;
  box-shadow: 0 0 25px #a21c1c44;
  transform: translateY(-5px);
}

.slot-number {
  color: #c52b2b;
  font-size: 11px;
  letter-spacing: 4px;
}

.shutter {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    #292929 0px,
    #292929 7px,
    #171717 8px,
    #171717 13px
  );
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 1s ease;
}

.shutter span {
  font-size: 12px;
  letter-spacing: 4px;
  background: #111;
  padding: 12px;
  border: 1px solid #555;
}

.slot.open .shutter {
  transform: translateY(-105%);
}

.car-name {
  font-size: 20px;
  margin-top: 15px;
  letter-spacing: 2px;
}

.slot-hint {
  color: #888;
  font-size: 10px;
  margin-top: 12px;
}

.footer {
  text-align: center;
  color: #555;
  font-size: 10px;
  letter-spacing: 3px;
  padding: 65px 10px 20px;
}

@media(max-width: 700px) {
  .slots {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .slot {
    min-height: 170px;
  }

  .car-name {
    font-size: 15px;
  }
}

@media(max-width: 370px) {
  .slots {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<section class="hero" id="entrance">
  <div class="label">PRIVATE AUTOMOTIVE COLLECTION</div>

  <h1>ATHISH'S<br><span>DREAM GARAGE</span></h1>

  <p class="subtitle">
    WHERE EVERY DREAM HAS A PARKING SPACE
  </p>

  <button class="enter-btn" onclick="enterGarage()">
    ENTER GARAGE
  </button>
</section>

<section class="garage" id="garage">

  <header class="garage-header">
    <h2>THE UNDERGROUND</h2>
    <p>SELECT YOUR PARKING BAY</p>
  </header>

  <div class="slots" id="slots"></div>

  <div class="footer">
    ATHISH'S PRIVATE COLLECTION · EST. 2026
  </div>

</section>

<script>
const cars = [
  {name: "SKODA OCTAVIA", id: "01"},
  {name: "SKODA SUPERB", id: "02"},
  {name: "VW VIRTUS", id: "03"},
  {name: "BMW M3", id: "04"},
  {name: "BMW M5", id: "05"},
  {name: "MERCEDES MAYBACH", id: "06"},
  {name: "NISSAN GT-R", id: "07"}
];

function enterGarage() {
  document.getElementById("entrance").style.display = "none";
  document.getElementById("garage").style.display = "block";
  window.scrollTo(0, 0);
}

const slots = document.getElementById("slots");

cars.forEach(car => {
  const slot = document.createElement("div");
  slot.className = "slot";

  slot.innerHTML = `
    <div class="slot-number">BAY ${car.id}</div>
    <div class="car-name">${car.name}</div>
    <div class="slot-hint">TAP TO ACCESS</div>
    <div class="shutter">
      <span>ACCESS BAY ${car.id}</span>
    </div>
  `;

  slot.addEventListener("click", () => {
    slot.classList.toggle("open");
  });

  slots.appendChild(slot);
});
</script>

</body>
</html>
