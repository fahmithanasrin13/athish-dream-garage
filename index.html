
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athish's Dream Garage</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#080d14;color:#edf1f5;font-family:Rajdhani,sans-serif}
button{font:inherit;cursor:pointer}
#scene{position:fixed;inset:0}
canvas{display:block}
.topbar{position:fixed;top:0;left:0;right:0;padding:20px 25px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#080d14ee,transparent);pointer-events:none;z-index:2}
.brand{font:700 clamp(15px,2vw,24px) Orbitron;letter-spacing:2px}
.brand span{color:#c9a36b}
.sub{font:11px Orbitron;letter-spacing:3px;color:#8794a2;margin-top:7px}
.online{font:11px Orbitron;letter-spacing:2px;color:#91c5a7}
.online:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#6cdaa0;margin-right:9px}
.hint{position:fixed;top:105px;left:50%;transform:translateX(-50%);font:11px Orbitron;letter-spacing:2px;color:#aab5c1;white-space:nowrap;pointer-events:none}
.bottom{position:fixed;bottom:0;left:0;right:0;padding:15px 18px 20px;display:flex;justify-content:space-between;align-items:end;gap:10px;background:linear-gradient(transparent,#080d14f2 30%);z-index:3}
.bays,.actions{display:flex;gap:7px;flex-wrap:wrap}
.btn{background:#101923eF;border:1px solid #536171;color:#dce4ec;padding:9px 12px;border-radius:3px;font:10px Orbitron;letter-spacing:.5px}
.btn:hover,.btn.active{border-color:#d1aa70;color:#f2ca8c;background:#272116}
.panel{position:fixed;left:20px;top:120px;width:min(350px,calc(100vw - 40px));max-height:calc(100vh - 250px);overflow:auto;background:#0b131eee;border:1px solid #a1845b;padding:18px;z-index:5;display:none;backdrop-filter:blur(14px)}
.panel.show{display:block}
.panel-head{display:flex;justify-content:space-between;align-items:start}
.panel h2{font:700 18px Orbitron;color:#e7bd80;margin:5px 0}
.panel .close{background:none;border:0;color:#aeb9c5;font-size:22px}
.eyebrow{font:10px Orbitron;letter-spacing:2px;color:#c49a5e}
.model{font:11px Orbitron;letter-spacing:1.5px;color:#8493a3;margin:8px 0 15px}
.tabs{display:flex;gap:5px;margin:15px 0;border-bottom:1px solid #34404c;padding-bottom:9px}
.tab{flex:1;padding:8px 4px;background:#111b26;border:1px solid #354453;color:#aab7c5;font:9px Orbitron}
.tab.active{color:#f0c98b;border-color:#b18a57}
.content{font-size:14px;line-height:1.5;color:#c6d0da;min-height:105px}
.content p{margin:8px 0}
.content strong{color:#edf1f5}
.tag{color:#d5ad72;font:10px Orbitron;letter-spacing:1px;margin:10px 0}
.panel-actions{display:flex;gap:7px;margin-top:14px}
.panel-actions button{flex:1}
.note{font-size:10px;color:#718093;margin-top:10px}
@media(max-width:700px){
 .topbar{padding:14px}.online{display:none}
 .hint{top:85px;font-size:9px}
 .bottom{display:block;padding:10px}
 .bays{justify-content:center;gap:5px}
 .btn{font-size:8px;padding:8px}
 .actions{justify-content:center;margin-top:8px}
 .panel{top:95px;left:10px;width:min(320px,calc(100vw - 20px))}
}
</style>
</head>
<body>
<div id="scene"></div>

<div class="topbar">
 <div>
  <div class="brand">ATHISH'S <span>DREAM GARAGE</span></div>
  <div class="sub">A PRIVATE COLLECTION · EST. 2026</div>
 </div>
 <div class="online">SYSTEM ONLINE</div>
</div>

<div class="hint">SELECT A GARAGE BAY TO ACCESS YOUR CAR</div>

<div class="panel" id="panel">
 <div class="panel-head">
  <div>
   <div class="eyebrow">GARAGE COLLECTION / <span id="number">01</span></div>
   <h2 id="name">SKODA OCTAVIA</h2>
  </div>
  <button class="close" id="close">×</button>
 </div>
 <div class="model" id="subtitle"></div>
 <div class="tabs">
  <button class="tab active" data-tab="exterior">EXTERIOR</button>
  <button class="tab" data-tab="interior">INTERIOR</button>
  <button class="tab" data-tab="specs">SPECS</button>
 </div>
 <div class="content" id="content"></div>
 <div class="panel-actions">
  <button class="btn" id="lift">RAISE CAR</button>
  <button class="btn" id="sound">ENGINE SOUND</button>
 </div>
 <div class="note">Generated engine preview. Authentic recordings can be added later.</div>
</div>

<div class="bottom">
 <div class="bays" id="bayButtons"></div>
 <div class="actions">
  <button class="btn" id="parkAll">PARK ALL</button>
  <button class="btn" id="reset">RESET VIEW</button>
 </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const cars=[
 {name:"SKODA OCTAVIA",short:"THE ONE THAT STARTED IT ALL",color:0x9e202b,body:"Matte racing red",interior:"Premium tan leather",status:"NEVER SELL",engine:"Performance-focused sedan engine",desc:"The heart of this collection. The car that represents you. This bay is permanently reserved."},
 {name:"SKODA SUPERB",short:"THE LUXURY DREAM",color:0x202a35,body:"Deep metallic black",interior:"Tan luxury leather",status:"DREAM COLLECTION",engine:"Luxury sedan powertrain",desc:"A refined luxury sedan. Comfort, presence and elegance in one machine."},
 {name:"VOLKSWAGEN VIRTUS",short:"THE CHILDHOOD DREAM",color:0x8b2027,body:"Glossy deep red",interior:"Black and tan",status:"DREAM COLLECTION",engine:"Turbocharged sedan powertrain",desc:"The childhood dream that earned its place in this garage."},
 {name:"BMW M3",short:"THE DRIVER'S MACHINE",color:0x303b48,body:"Matte graphite",interior:"Black sport interior",status:"DREAM COLLECTION",engine:"BMW M performance powertrain",desc:"A performance sedan built around the joy of driving."},
 {name:"BMW M5",short:"THE POWERHOUSE",color:0x172e50,body:"Metallic dark blue",interior:"Black leather",status:"DREAM COLLECTION",engine:"BMW M performance powertrain",desc:"The special engine sound. The serious performance machine."},
 {name:"MERCEDES-MAYBACH",short:"THE ULTIMATE LUXURY",color:0x171a1f,body:"Obsidian black",interior:"Exclusive tan leather",status:"DREAM COLLECTION",engine:"Luxury V12 option to be confirmed",desc:"The ultimate expression of luxury. A special place in the collection."},
 {name:"NISSAN GT-R",short:"THE PAUL WALKER TRIBUTE",color:0x9da6ae,body:"Silver metallic",interior:"Black sport interior",status:"DREAM COLLECTION",engine:"GT-R performance powertrain",desc:"A tribute to an icon. The machine reserved for the track."},
 {name:"MERCEDES-AMG S 63 E",short:"THE PERFORMANCE LUXURY",color:0x141b23,body:"Glossy obsidian",interior:"Black and tan",status:"DREAM COLLECTION",engine:"AMG hybrid performance powertrain",desc:"A powerful luxury sedan. Quiet sophistication with serious performance."}
];

let scene,camera,renderer,controls,clock;
let bays=[],selected=-1,raycaster,mouse;
let audio=null,osc=null,activeTab='exterior';
const panel=document.getElementById('panel');
const buttons=document.getElementById('bayButtons');

init();
animate();

function mat(color,roughness=.7,metalness=.15){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}
function box(parent,w,h,d,x,y,z,material,cast=true){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;parent.add(m);return m;
}

function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x080d14);
 scene.fog=new THREE.Fog(0x080d14,40,90);

 camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,150);
 camera.position.set(19,10,27);

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.15;
 document.getElementById('scene').appendChild(renderer.domElement);

 controls=new OrbitControls(camera,renderer.domElement);
 controls.target.set(0,-1.1,0);
 controls.enableDamping=true;
 controls.dampingFactor=.07;
 controls.minDistance=15;
 controls.maxDistance=48;
 controls.maxPolarAngle=Math.PI/2.05;

 clock=new THREE.Clock();
 raycaster=new THREE.Raycaster();
 mouse=new THREE.Vector2();

 scene.add(new THREE.HemisphereLight(0xb8c7d8,0x171a20,1));
 const sun=new THREE.DirectionalLight(0xffe6c8,1.5);
 sun.position.set(-10,18,12);sun.castShadow=true;
 sun.shadow.mapSize.set(2048,2048);scene.add(sun);

 buildArchitecture();
 cars.forEach((car,i)=>buildBay(car,i));
 buildButtons();

 renderer.domElement.addEventListener('pointerdown',pickBay);
 document.getElementById('close').onclick=()=>closePanel();
 document.getElementById('lift').onclick=()=>toggleLift(selected);
 document.getElementById('sound').onclick=toggleSound;
 document.getElementById('parkAll').onclick=parkAll;
 document.getElementById('reset').onclick=resetView;

 document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
   activeTab=btn.dataset.tab;
   document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===btn));
   renderDetails();
  });
 });
 window.addEventListener('resize',resize);
}

function buildArchitecture(){
 const concrete=mat(0x343a40,.9);
 const wall=mat(0x202832,.9);
 const dark=mat(0x10161d,.8);
 const gold=mat(0xa58a62,.45,.65);
 const lane=mat(0x252c33,.85);

 // Basement floor and back wall
 box(scene,29,.35,14,0,-4.25,-.1,concrete,false);
 box(scene,29,4.8,.35,0,-1.9,-7.15,wall,false);
 box(scene,.35,4.8,14,-14.5,-1.9,-.1,wall,false);
 box(scene,.35,4.8,14,14.5,-1.9,-.1,wall,false);

 // Upper driveway: visible lane in front of the garage
 box(scene,30,.28,8,0,-.08,7.2,lane,false);
 for(let x=-12;x<=12;x+=4){
  box(scene,.06,.02,5,x,.08,7.2,gold,false);
 }
 // Road edge markings
 box(scene,30,.035,.09,0,.09,3.25,gold,false);
 box(scene,30,.035,.09,0,.09,11.1,gold,false);

 // Cutaway ceiling rim and structural beams
 for(let x=-12;x<=12;x+=6){
  box(scene,.22,.35,14,x,.25,-.1,gold,false);
 }
 // Lighting along the back of each bay
 for(let x=-12;x<=12;x+=3.4){
  const light=new THREE.PointLight(0xffdfb9,20,8,2);
  light.position.set(x,-.4,-3.5);scene.add(light);
  const lamp=box(scene,1.8,.08,.35,x,.15,-3.5,mat(0xe4d2b5,.3),false);
  lamp.material.emissive=new THREE.Color(0x403020);
 }
 // Entrance pillars
 for(const x of [-14,14]){
  box(scene,.35,4.7,.45,x,-1.9,3.15,gold,false);
 }
 // Bay dividers
 for(let i=0;i<=8;i++){
  const x=-13.6+i*3.4;
  box(scene,.13,4.2,7.4,x,-1.9,-.2,wall,false);
  box(scene,.19,.12,7.4,x,-3.95,-.2,gold,false);
 }
 // A visible front cutaway frame
 box(scene,28,.22,.22,0,.05,3.2,gold,false);
}

function buildBay(car,index){
 const group=new THREE.Group();
 const x=(index-3.5)*3.4;
 group.position.x=x;scene.add(group);

 const steel=mat(0x687581,.35,.75);
 const platformMat=mat(0x555f69,.65,.45);
 const gold=mat(0xb18e5e,.4,.7);

 // Deep elevator shaft walls
 box(group,2.95,.18,6.4,0,-4.05,-.1,mat(0x111820),false);
 box(group,.12,3.8,6.3,-1.52,-2.05,-.1,wallMat(),false);
 box(group,.12,3.8,6.3,1.52,-2.05,-.1,wallMat(),false);

 // Platform is the actual elevator deck.
 const platform=box(group,2.72,.22,6.05,0,-3.78,-.05,platformMat);
 box(group,2.68,.035,.07,0,-3.64,2.94,gold,false);
 box(group,2.68,.035,.07,0,-3.64,-3.04,gold,false);

 // Hydraulic piston columns, fixed lower sections and moving upper sections
 const pistons=[];
 for(const xx of [-1.12,1.12]){
  for(const zz of [-2.3,2.2]){
   box(group,.22,1.1,.22,xx,-3.25,zz,mat(0x303a43,.4,.8));
   const moving=box(group,.13,2.0,.13,xx,-2.65,zz,steel);
   pistons.push(moving);
  }
 }

 // Shutter at the front of the individual bay
 const shutter=new THREE.Group();
 shutter.position.set(0,-1.75,3.12);
 group.add(shutter);
 const shutterMat=mat(0x4a555f,.55,.55);
 for(let k=0;k<13;k++){
  box(shutter,3.05,.145,.09,0,-.9+k*.15,0,shutterMat,false);
 }
 // Shutter guide rails
 for(const xx of [-1.58,1.58]){
  box(group,.1,3.8,.13,xx,-1.75,3.1,gold,false);
 }

 const carGroup=makeCar(car,index);
 carGroup.position.set(0,-3.52,-.1);
 group.add(carGroup);

 // Only this dedicated invisible bay target is clickable.
 const hit=new THREE.Mesh(
  new THREE.BoxGeometry(3.1,3.5,.5),
  new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false})
 );
 hit.position.set(0,-1.9,3.25);
 hit.userData.bayIndex=index;
 group.add(hit);

 // Bay number plaque
 const plaque=makePlaque(String(index+1).padStart(2,'0'));
 plaque.position.set(0,-.3,-6.93);
 group.add(plaque);

 bays.push({
  group,platform,shutter,carGroup,pistons,hit,
  lift:0,shutterOpen:0,targetLift:0,targetShutter:0
 });
}

function wallMat(){return mat(0x303a44,.9)}
function makePlaque(label){
 const c=document.createElement('canvas');c.width=256;c.height=128;
 const ctx=c.getContext('2d');
 ctx.fillStyle='#111923';ctx.fillRect(0,0,256,128);
 ctx.strokeStyle='#c4a06b';ctx.lineWidth=5;ctx.strokeRect(5,5,246,118);
 ctx.fillStyle='#f0d09b';ctx.font='bold 65px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,128,66);
 return new THREE.Mesh(new THREE.PlaneGeometry(1.15,.58),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c)}));
}

function makeCar(car,index){
 const g=new THREE.Group();
 const paint=mat(car.color,.28,.72);
 const glass=mat(0x142735,.16,.5);
 const black=mat(0x080c11,.5,.2);
 const chrome=mat(0xb5c0c7,.25,.85);
 const tire=mat(0x101214,.95);
 const leather=mat(index===0?0x98774f:0x252b31,.75);

 // Sedan body, bonnet and boot
 box(g,1.78,.48,3.95,0,.65,0,paint);
 box(g,1.7,.16,1.1,0,.95,1.35,paint);
 box(g,1.7,.16,.85,0,.95,-1.55,paint);
 box(g,1.62,.65,1.95,0,1.15,-.25,glass);
 box(g,1.48,.09,1.55,0,1.51,-.28,paint);

 // Front/rear windows
 box(g,1.45,.43,.07,0,1.22,.78,glass);
 box(g,1.43,.4,.07,0,1.22,-1.27,glass);

 // Interior seats
 for(const z of [-.75,.35]){
  for(const xx of [-.43,.43]){
   box(g,.4,.42,.4,xx,1.02,z,leather);
  }
 }
 // Dashboard and steering wheel
 box(g,1.15,.13,.3,0,1.03,.62,black);
 const wheel=new THREE.Mesh(new THREE.TorusGeometry(.16,.025,8,24),black);
 wheel.position.set(-.43,1.18,.56);g.add(wheel);

 // Wheels and alloy centres
 for(const xx of [-.92,.92]){
  for(const z of [-1.28,1.28]){
   const w=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.22,24),tire);
   w.rotation.z=Math.PI/2;w.position.set(xx,.43,z);g.add(w);
   const hub=new THREE.Mesh(new THREE.CylinderGeometry(.21,.21,.235,20),chrome);
   hub.rotation.z=Math.PI/2;hub.position.set(xx*1.01,.43,z);g.add(hub);
  }
 }
 // Bumpers and grille
 box(g,1.72,.2,.2,0,.53,2.02,black);
 box(g,1.72,.2,.2,0,.53,-2.02,black);
 box(g,.72,.24,.04,0,.66,2.13,black);

 const headlight=mat(0xffedc9,.25,.2);
 headlight.emissive=new THREE.Color(0xffd99b);
 headlight.emissiveIntensity=.7;
 for(const xx of [-.58,.58]){
  box(g,.4,.14,.05,xx,.77,2.04,headlight,false);
  const tail=mat(0x9f1820,.25,.2);
  tail.emissive=new THREE.Color(0x5b090c);
  box(g,.4,.13,.05,xx,.77,-2.04,tail,false);
  box(g,.17,.13,.25,xx*1.7,1.08,.55,paint);
 }
 return g;
}

function buildButtons(){
 cars.forEach((car,i)=>{
  const b=document.createElement('button');
  b.className='btn';
  b.textContent=String(i+1).padStart(2,'0')+' · '+car.name.split(' ')[0];
  b.onclick=()=>selectBay(i);
  buttons.appendChild(b);
 });
}

function selectBay(i){
 if(i<0||i>=bays.length)return;
 if(selected!==-1&&selected!==i){
  const previous=bays[selected];
  previous.targetLift=0;
  previous.targetShutter=0;
 }
 selected=i;
 const bay=bays[i];
 bay.targetShutter=1;
 bay.targetLift=1;

 [...buttons.children].forEach((b,n)=>b.classList.toggle('active',n===i));
 activeTab='exterior';
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab==='exterior'));

 document.getElementById('number').textContent=String(i+1).padStart(2,'0');
 document.getElementById('name').textContent=cars[i].name;
 document.getElementById('subtitle').textContent=cars[i].short;
 panel.classList.add('show');
 renderDetails();

 // IMPORTANT: no camera position, target, zoom or controls changes here.
}

function renderDetails(){
 const car=cars[selected];
 if(!car)return;
 const content=document.getElementById('content');
 if(activeTab==='exterior'){
  content.innerHTML=`
   <div class="tag">EXTERIOR PROFILE</div>
   <p>${car.desc}</p>
   <p><strong>Body finish:</strong> ${car.body}</p>
   <p><strong>Collection status:</strong> ${car.status}</p>
   <p><strong>Bay:</strong> ${String(selected+1).padStart(2,'0')}</p>`;
 }else if(activeTab==='interior'){
  content.innerHTML=`
   <div class="tag">CABIN / INTERIOR</div>
   <p><strong>Interior finish:</strong> ${car.interior}</p>
   <p>Cabin preview includes visible seats, dashboard and steering wheel in the 3D model.</p>
   <p>Detailed cockpit materials, door opening and interactive interior inspection are planned for the next modelling stage.</p>`;
 }else{
  content.innerHTML=`
   <div class="tag">VEHICLE INFORMATION</div>
   <p><strong>Vehicle:</strong> ${car.name}</p>
   <p><strong>Body style:</strong> Sedan / performance collection</p>
   <p><strong>Powertrain:</strong> ${car.engine}</p>
   <p><strong>Finish:</strong> ${car.body}</p>
   <p><strong>Interior:</strong> ${car.interior}</p>
   <p><strong>Status:</strong> ${car.status}</p>
   <p class="note">Exact year, trim and factory specifications await model confirmation.</p>`;
 }
}

function toggleLift(i){
 if(i<0)return;
 const bay=bays[i];
 const rising=bay.targetLift<.5;
 bay.targetShutter=1;
 bay.targetLift=rising?1:0;
 document.getElementById('lift').textContent=rising?'PARK CAR':'RAISE CAR';
 if(!rising)stopSound();
}

function closePanel(){
 panel.classList.remove('show');
}
function parkAll(){
 bays.forEach(b=>{b.targetLift=0;b.targetShutter=0;});
 selected=-1;
 panel.classList.remove('show');
 [...buttons.children].forEach(b=>b.classList.remove('active'));
 stopSound();
}
function resetView(){
 camera.position.set(19,10,27);
 controls.target.set(0,-1.1,0);
 controls.update();
}
function toggleSound(){
 if(osc){stopSound();return;}
 try{
  audio=new (window.AudioContext||window.webkitAudioContext)();
  osc=audio.createOscillator();
  const gain=audio.createGain();
  const filter=audio.createBiquadFilter();
  osc.type='sawtooth';
  osc.frequency.value=65;
  filter.type='lowpass';filter.frequency.value=180;
  gain.gain.value=.035;
  osc.connect(filter);filter.connect(gain);gain.connect(audio.destination);
  osc.start();
  document.getElementById('sound').textContent='STOP SOUND';
 }catch(e){alert('Audio preview unavailable in this browser.');}
}
function stopSound(){
 if(osc){try{osc.stop()}catch(e){}osc=null;}
 if(audio){audio.close();audio=null;}
 const b=document.getElementById('sound');
 if(b)b.textContent='ENGINE SOUND';
}

function pickBay(event){
 // Ignore UI, and only test the eight dedicated bay hit zones.
 if(event.target.closest('button')||event.target.closest('.panel'))return;
 const rect=renderer.domElement.getBoundingClientRect();
 mouse.x=((event.clientX-rect.left)/rect.width)*2-1;
 mouse.y=-((event.clientY-rect.top)/rect.height)*2+1;
 raycaster.setFromCamera(mouse,camera);
 const targets=bays.map(b=>b.hit);
 const hits=raycaster.intersectObjects(targets,false);
 if(hits.length){
  const i=hits[0].object.userData.bayIndex;
  if(Number.isInteger(i))selectBay(i);
 }
 // Clicks on floor, walls, ceiling and other scenery do nothing.
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 bays.forEach(b=>{
  // Open shutter first; only then raise the lift.
  b.shutterOpen=THREE.MathUtils.damp(b.shutterOpen,b.targetShutter,3.5,dt);
  const liftAllowed=b.shutterOpen>.88?b.targetLift:0;
  b.lift=THREE.MathUtils.damp(b.lift,liftAllowed,1.5,dt);

  // The lift stops exactly at the upper driving-lane height.
  const bottom=-3.78;
  const top=-.02;
  const y=THREE.MathUtils.lerp(bottom,top,b.lift);
  b.platform.position.y=y;
  b.carGroup.position.y=y+.26;
  b.pistons.forEach(p=>{
   p.position.y=-3.1+b.lift*1.65;
   p.scale.y=1+b.lift*.65;
  });

  // Shutter retracts vertically into its own overhead pocket.
  b.shutter.position.y=-1.75+b.shutterOpen*3.15;
 });
 controls.update();
 renderer.render(scene,camera);
}
function resize(){
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}
window.addEventListener('resize',resize);
</script>
